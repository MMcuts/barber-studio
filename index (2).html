<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Barber Studio Illzach</title>
<meta name="theme-color" content="#0E0E10">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700;800&display=swap">
<style>
/* Mobile-first, une colonne de 430 px max. Sombre par défaut, clair si le téléphone est en mode clair. */
:root{
  --bg:#0E0E10; --card:#1A1A1E; --card2:#24242A; --line:#323238;
  --fg:#F2F0EA; --muted:#A8A49A; --gold:#D8B25A; --gold-ink:#0E0E10; --gold-soft:rgba(216,178,90,.13);
  --ok:#6CC28A; --warn:#E6A93E; --bad:#E7695C; --scrim:rgba(0,0,0,.62);
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-title:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --r:16px; color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#F3F1EB; --card:#FFFFFF; --card2:#ECE8DE; --line:#DAD4C6;
    --fg:#17161A; --muted:#67625A; --gold:#9A7120; --gold-ink:#FFFFFF; --gold-soft:rgba(154,113,32,.11);
    --ok:#23804D; --warn:#A76A0E; --bad:#BF3A2C; --scrim:rgba(20,18,14,.45); color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#F3F1EB; --card:#FFFFFF; --card2:#ECE8DE; --line:#DAD4C6;
  --fg:#17161A; --muted:#67625A; --gold:#9A7120; --gold-ink:#FFFFFF; --gold-soft:rgba(154,113,32,.11);
  --ok:#23804D; --warn:#A76A0E; --bad:#BF3A2C; --scrim:rgba(20,18,14,.45); color-scheme:light;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.45;margin:0;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.app{max-width:430px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--gold)}
img{max-width:100%}

/* En-tête et onglets */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:10px 10px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--card);border-radius:14px;padding:4px}
.tab{appearance:none;border:0;background:transparent;color:var(--muted);font:700 15px/1 var(--f-title);text-transform:uppercase;letter-spacing:.07em;min-height:48px;border-radius:11px;position:relative}
.tab[aria-current="page"]{background:var(--gold);color:var(--gold-ink)}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:10px;background:var(--bad);color:#FFFFFF;font:700 11px/1 var(--f-body);padding:0 6px;letter-spacing:0}
.tab .badge{position:absolute;top:4px;right:6px}

/* Typo */
.h1,.h2,.h3{font-family:var(--f-title);text-transform:uppercase;margin:0;text-wrap:balance;line-height:1}
.h1{font-size:44px;font-weight:800;letter-spacing:.005em}
.h2{font-size:27px;font-weight:700;letter-spacing:.02em}
.h3{font-size:19px;font-weight:700;letter-spacing:.04em}
.lead{font-size:17px;color:var(--muted);margin:0}
p{margin:0}
.eyebrow{display:flex;align-items:center;gap:10px;color:var(--gold);font:600 13px/1.2 var(--f-title);text-transform:uppercase;letter-spacing:.16em}
.eyebrow::before{content:"";width:28px;height:2px;background:var(--gold);flex:none}
.muted{color:var(--muted)} .small{font-size:14px} .tiny{font-size:12.5px} .gold{color:var(--gold)} .ok{color:var(--ok)} .bad{color:var(--bad)} .warn{color:var(--warn)}
.num{font-variant-numeric:tabular-nums}
.pre{white-space:pre-line}
.ta-r{text-align:right}
.label{font:600 12.5px/1.2 var(--f-title);text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}

/* Mise en page */
.stack{display:flex;flex-direction:column;gap:12px}
.stack-s{display:flex;flex-direction:column;gap:6px}
.stack-l{display:flex;flex-direction:column;gap:22px}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--card);border-radius:var(--r);padding:16px}
.card.line{background:transparent;border:1px solid var(--line)}
.card.gold{background:var(--gold-soft);border:1px solid var(--gold)}
.block{padding-block:30px 6px;display:flex;flex-direction:column;gap:16px}
.sep{height:1px;background:var(--line);border:0;margin:4px 0}

/* Boutons */
.btn{appearance:none;border:1px solid var(--line);background:var(--card2);color:var(--fg);font:700 16px/1.1 var(--f-title);text-transform:uppercase;letter-spacing:.07em;min-height:54px;padding:0 18px;border-radius:13px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;width:100%;text-align:center}
.btn-gold{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.btn-ghost{background:transparent}
.btn-danger{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn-sm{min-height:44px;font-size:14px;padding:0 14px;width:auto;border-radius:11px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.link{appearance:none;background:none;border:0;color:var(--gold);font-weight:600;padding:10px 0;text-decoration:underline;text-underline-offset:3px}
.back{appearance:none;background:none;border:0;color:var(--muted);font:600 15px var(--f-title);text-transform:uppercase;letter-spacing:.08em;min-height:44px;padding:0;display:inline-flex;align-items:center;gap:6px}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* Champs */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font-size:14px;color:var(--muted);font-weight:500}
input,textarea,select{font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:12px;min-height:52px;padding:12px 14px;width:100%;min-width:0}
input:focus,textarea:focus,select:focus{border-color:var(--gold);outline:none}
textarea{min-height:100px;resize:vertical}
input[type=checkbox]{width:26px;height:26px;min-height:0;padding:0;accent-color:var(--gold);flex:none;margin:0}
.check{display:flex;gap:12px;align-items:center;min-height:52px;cursor:pointer}
.check .grow{font-weight:500}
.toggle-row{display:flex;gap:12px;align-items:center;justify-content:space-between;min-height:52px;cursor:pointer;font-weight:600}

/* Options cliquables */
.opt{appearance:none;width:100%;text-align:left;border:2px solid var(--line);background:var(--card);color:var(--fg);border-radius:var(--r);padding:16px;display:flex;gap:12px;align-items:center;justify-content:space-between;min-height:72px}
.opt[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft)}
.opt-t{font:700 20px/1.1 var(--f-title);text-transform:uppercase;letter-spacing:.03em}
.price{font:700 23px/1 var(--f-title);color:var(--gold);white-space:nowrap}
.chipset{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--fg);min-height:44px;padding:0 16px;border-radius:999px;font:600 15px var(--f-body);display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}

/* Pastilles */
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font:700 11.5px/1.3 var(--f-body);text-transform:uppercase;letter-spacing:.05em;background:var(--card2);color:var(--muted);white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--ok) 17%,transparent);color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--warn) 17%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 17%,transparent);color:var(--bad)}
.pill.gold{background:var(--gold-soft);color:var(--gold)}

/* Accueil */
.brand{display:flex;align-items:center;gap:14px;padding-block:10px 16px}
.avatar{width:66px;height:66px;border-radius:50%;background:var(--card2);border:2px solid var(--gold);overflow:hidden;display:grid;place-items:center;font:800 30px/1 var(--f-title);color:var(--gold);flex:none}
.avatar img{width:100%;height:100%;object-fit:cover}
.brand-name{font:800 30px/1 var(--f-title);text-transform:uppercase;letter-spacing:.02em}
.brand-tag{color:var(--gold);font:600 14px/1.4 var(--f-title);letter-spacing:.24em;text-transform:uppercase}
.carousel{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:20px;scrollbar-width:none;background:var(--card)}
.carousel::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;position:relative;aspect-ratio:4/5;max-width:100%;margin:0}
.slide img{width:100%;height:100%;object-fit:cover;display:block}
.slide figcaption{position:absolute;left:0;right:0;bottom:0;padding:48px 18px 16px;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.78));color:#F2F0EA;font-weight:600;font-size:16px}
.dots{display:flex;justify-content:center;gap:2px;padding-top:6px}
.dots button{appearance:none;border:0;background:none;width:30px;height:30px;display:grid;place-items:center;padding:0}
.dots button::after{content:"";width:8px;height:8px;border-radius:4px;background:var(--line);transition:width .2s}
.dots button[aria-current="true"]::after{width:22px;background:var(--gold)}
.hero{padding-block:22px 0;display:flex;flex-direction:column;gap:16px}
.hero .btns{display:flex;flex-direction:column;gap:10px;padding-top:4px}
.banner{border:1px solid var(--gold);background:var(--gold-soft);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;margin-top:26px}
.banner-k{font:800 22px/1 var(--f-title);text-transform:uppercase;color:var(--gold);letter-spacing:.03em}
.svc-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.svc-row:last-child{border-bottom:0}
.svc-name{font:700 21px/1.1 var(--f-title);text-transform:uppercase;letter-spacing:.02em}
.steps-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;counter-reset:s}
.steps-list li{display:flex;gap:14px;align-items:flex-start}
.steps-list li::before{counter-increment:s;content:counter(s);flex:none;width:40px;height:40px;border-radius:50%;border:2px solid var(--gold);color:var(--gold);display:grid;place-items:center;font:800 20px/1 var(--f-title)}
.perk{display:flex;flex-direction:column;gap:4px}
.perk-v{font:800 26px/1 var(--f-title);color:var(--gold);text-transform:uppercase}
.stars{color:var(--gold);letter-spacing:2px;white-space:nowrap}
.stars .off{color:var(--line)}
.review{display:flex;flex-direction:column;gap:6px}
.about-img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:var(--r);display:block}
.notice{border-left:3px solid var(--warn);background:var(--card);padding:12px 14px;border-radius:0 12px 12px 0}

/* Réservation */
.progress{display:flex;gap:4px;padding-block:6px 4px}
.progress i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.progress i.on{background:var(--gold)}
.weeknav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.weeknav .btn-sm{min-width:48px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{appearance:none;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg);padding:8px 0 6px;text-align:center;min-height:70px;display:flex;flex-direction:column;align-items:center;gap:2px}
.day b{font:800 22px/1 var(--f-title)}
.day .d{font:600 11px/1 var(--f-title);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.day .s{font-size:9.5px;font-weight:700;text-transform:uppercase;color:var(--muted);letter-spacing:.02em}
.day[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.day[aria-pressed="true"] .d,.day[aria-pressed="true"] .s{color:var(--gold-ink)}
.day:disabled{opacity:.38}
.day.full .s{color:var(--bad)}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{appearance:none;min-height:50px;border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:600 16px var(--f-body);font-variant-numeric:tabular-nums}
.slot.taken{text-decoration:line-through;color:var(--muted);opacity:.5;background:transparent}
.slot[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.upload{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:2px dashed var(--line);border-radius:var(--r);min-height:150px;padding:16px;text-align:center;cursor:pointer;color:var(--muted)}
.upload b{color:var(--fg);font:700 18px var(--f-title);text-transform:uppercase;letter-spacing:.05em}
.upload input{position:absolute;width:1px;height:1px;opacity:0}
.thumb{width:100%;max-height:320px;object-fit:cover;border-radius:var(--r);display:block}
.thumb-s{width:64px;height:64px;object-fit:cover;border-radius:10px;flex:none}
.lines{display:flex;flex-direction:column;gap:6px}
.lines .row{justify-content:space-between}
.total{font:800 30px/1 var(--f-title);color:var(--gold)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px}
.kv dt{color:var(--muted);font-size:14px}
.kv dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}
.big-check{width:76px;height:76px;border-radius:50%;background:var(--gold);color:var(--gold-ink);display:grid;place-items:center;font:800 40px/1 var(--f-title);margin:8px auto 0}

/* Mon espace */
.subtabs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.subtabs button{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--fg);min-height:48px;border-radius:12px;font:700 15px var(--f-title);text-transform:uppercase;letter-spacing:.07em;display:flex;align-items:center;justify-content:center;gap:8px}
.subtabs button[aria-current="page"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.appt{appearance:none;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:14px;padding:14px;display:flex;gap:14px;align-items:center}
.appt-date{flex:none;width:58px;text-align:center;border-right:1px solid var(--line);padding-right:12px}
.appt-date b{display:block;font:800 26px/1 var(--f-title)}
.appt-date span{font:600 12px/1.2 var(--f-title);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.stamps{display:grid;gap:8px}
.stamp{aspect-ratio:1;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;font:800 14px/1 var(--f-title);color:var(--muted)}
.stamp.on{background:var(--gold);border:2px solid var(--gold);color:var(--gold-ink)}
.stamp.gift{border:2px solid var(--gold);color:var(--gold);font-size:12px}
.code{font:800 30px/1 var(--f-title);letter-spacing:.12em;color:var(--gold);user-select:all}
.rate{display:flex;gap:4px}
.rate button{appearance:none;background:none;border:0;font-size:38px;line-height:1;color:var(--line);padding:2px;min-width:44px;min-height:48px}
.rate button.on{color:var(--gold)}
.thread{display:flex;flex-direction:column;gap:8px}
.msg{max-width:84%;padding:10px 14px;border-radius:16px 16px 16px 4px;background:var(--card2);align-self:flex-start;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--gold);color:var(--gold-ink);border-radius:16px 16px 4px 16px}
.msg .tiny{opacity:.72;margin-top:4px}
.msg.sys{align-self:center;background:transparent;border:1px dashed var(--line);color:var(--muted);font-size:14px;text-align:center;border-radius:12px}
.composer{position:sticky;bottom:0;background:var(--bg);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:flex-end}
.composer textarea{min-height:52px;height:52px}
.composer .btn{width:auto;flex:none}

/* Espace coiffeur */
.chips-scroll{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.chips-scroll::-webkit-scrollbar{display:none}
.bchip{appearance:none;flex:none;min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:700 14px var(--f-title);text-transform:uppercase;letter-spacing:.06em;display:inline-flex;align-items:center;gap:6px}
.bchip[aria-current="page"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.list{display:flex;flex-direction:column}
.li{appearance:none;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);color:var(--fg);padding:14px 0;display:flex;gap:12px;align-items:center;min-height:60px}
.li:last-child{border-bottom:0}
.li-t{font-weight:700}
.li .time{font:800 22px/1 var(--f-title);width:58px;flex:none;font-variant-numeric:tabular-nums}
.daytitle{font:700 15px var(--f-title);text-transform:uppercase;letter-spacing:.1em;color:var(--gold);padding-top:14px}
.stat{background:var(--card);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.stat b{font:800 26px/1 var(--f-title);font-variant-numeric:tabular-nums}
.bar{height:10px;background:var(--card2);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);border-radius:5px}
.pin-dots{display:flex;justify-content:center;gap:16px;padding:18px 0}
.pin-dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--gold)}
.pin-dots i.on{background:var(--gold)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.key{appearance:none;min-height:66px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:700 28px/1 var(--f-title)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.ed-slide{display:flex;gap:12px;align-items:flex-start}
.ed-slide img{width:76px;height:95px;object-fit:cover;border-radius:10px;flex:none}
.timepair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.proof{width:100%;max-height:340px;object-fit:contain;background:var(--bg);border-radius:12px}
details.card>summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:32px}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"+";font:700 24px/1 var(--f-title);color:var(--gold)}
details.card[open]>summary::after{content:"–"}
details.card[open]>summary{margin-bottom:14px}

/* Fenêtre et toast */
#modal{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:430px;max-height:90vh;overflow:auto;border-radius:22px 22px 0 0;padding-top:20px;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:-6px auto 2px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);padding:13px 18px;border-radius:14px;font-weight:600;z-index:60;max-width:calc(100% - 32px);width:max-content;text-align:center;transition:.25s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:var(--bad);color:#FFFFFF}
#ts-box{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70}
#ts-box:empty{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<div class="app">
  <header class="top" id="top"></header>
  <main id="view"></main>
</div>
<div id="modal" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="ts-box"></div>
<!-- config.js : adresse du projet Supabase, clé publique (anon) et clé de site Turnstile. Généré depuis .env, jamais de clé secrète. -->
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>

function fill(def, obj){
  if (obj === null || typeof obj !== 'object' || Array.isArray(obj)) return obj === undefined ? def : obj;
  for (const k in def){
    if (!(k in obj)) obj[k] = def[k];
    else if (def[k] && typeof def[k] === 'object' && !Array.isArray(def[k])) obj[k] = fill(def[k], obj[k]);
  }
  return obj;
}

async function fetchAll(table){
  const out = [];
  for (let from = 0; ; from += 1000){
    const { data, error } = await sb.from(table).select('*').range(from, from + 999);
    if (error) throw error;
    out.push(...data);
    if (data.length < 1000) return out;
  }
}
async function rpc(fn, args){
  const { data, error } = await sb.rpc(fn, args);
  if (error) throw new Error(error.code === 'P0001' ? error.message : 'Connexion impossible. Réessaie.');
  return data;
}

// Charge ce que la personne a le droit de voir : tout pour l'admin, ses données pour
// un client, seulement la vitrine pour un visiteur. Les règles RLS filtrent côté serveur.
// soft : rechargement en direct, abandonné si une modification a eu lieu entre-temps.
async function load(soft){
  const d = defaults(), seq = editSeq;
  await sb.rpc('terminer_rdv_passes');
  const { data: hp } = await sb.from('page_accueil').select('contenu').eq('id', 1).maybeSingle();
  d.home = fill(defaults().home, hp?.contenu || {});
  if (isAdmin){
    const { data: rg, error } = await sb.from('reglages').select('*').eq('id', 1).single();
    if (error) throw error;
    d.settings = fill(defaults().settings, rg.reglages); d.templates = rg.modeles || []; d.demo = !!rg.demo;
    const [cl, no, su, ap, me_, rv, wl] = await Promise.all(['clients', 'clients_notes', 'abonnements', 'rdv', 'messages', 'avis', 'liste_attente'].map(fetchAll));
    const notes = new Map(no.map(x => [x.client_id, x.notes]));
    d.clients = cl.map(MAP.clients.from); d.clients.forEach(c => { c.notes = notes.get(c.id) || ''; });
    d.subs = su.map(MAP.subs.from); d.appts = ap.map(MAP.appts.from); d.messages = me_.map(MAP.messages.from);
    d.reviews = rv.map(MAP.reviews.from); d.waitlist = wl.map(MAP.waitlist.from);
  } else {
    const cfg = await rpc('config_publique');
    d.settings = fill(defaults().settings, cfg?.settings || {}); d.demo = !!cfg?.demo;
    const pubs = (await rpc('avis_publics')) || [];
    d.reviews = pubs.map(r => ({ id: r.id, clientId: null, name: r.nom, stars: r.note, text: r.texte, public: true, hidden: false, at: iso(r.cree_le) }));
    if (authUser){
      const [cl, su, ap, me_, rv, wl] = await Promise.all(['clients', 'abonnements', 'rdv', 'messages', 'avis', 'liste_attente'].map(fetchAll));
      d.clients = cl.map(MAP.clients.from);
      if (d.clients[0]) d.clients[0].refFriends = (await rpc('mes_parrainages')) || 0;
      d.subs = su.map(MAP.subs.from); d.appts = ap.map(MAP.appts.from); d.messages = me_.map(MAP.messages.from); d.waitlist = wl.map(MAP.waitlist.from);
      const mine = rv.map(MAP.reviews.from), ids = new Set(mine.map(r => r.id));
      d.reviews = d.reviews.filter(r => !ids.has(r.id)).concat(mine);
    }
  }
  if (soft && (seq !== editSeq || saving || saveT)) return false;
  db = d;
  takeSnapshot();
  await prefetchImages();
  return true;
}

// Enregistrement (compte admin) : on compare avec le dernier état connu du serveur
// et on n'envoie que les lignes ajoutées, modifiées ou supprimées.
let snap = null, saveT = null, saving = false, saveAgain = false, saveWarned = false, editSeq = 0;
function takeSnapshot(){
  snap = {};
  for (const n of ORDER) snap[n] = new Map(rowsOf(n).map(r => [keyOf(n, r), JSON.stringify(r)]));
  snap.reglages = JSON.stringify(reglagesRow()); snap.home = JSON.stringify(db.home);
}
function save(){
  if (!isAdmin || !snap) return true;
  editSeq++;
  clearTimeout(saveT); saveT = setTimeout(flush, 300);
  return true;
}
async function flush(){
  clearTimeout(saveT); saveT = null;
  if (!isAdmin || !snap) return;
  if (saving){ saveAgain = true; return; }
  saving = true;
  try {
    const cur = {};
    for (const n of ORDER) cur[n] = new Map(rowsOf(n).map(r => [keyOf(n, r), r]));
    // Suppressions d'abord (une sauvegarde restaurée peut réutiliser un code parrainage), puis ajouts et modifications.
    for (const n of ORDER.slice().reverse()){
      const del = [...snap[n].keys()].filter(k => !cur[n].has(k));
      for (let i = 0; i < del.length; i += 200){ const { error } = await sb.from(MAP[n].t).delete().in(MAP[n].key || 'id', del.slice(i, i + 200)); if (error) throw error; }
      del.forEach(k => snap[n].delete(k));
    }
    for (const n of ORDER){
      const up = [...cur[n].entries()].filter(([k, r]) => snap[n].get(k) !== JSON.stringify(r)).map(([, r]) => r);
      for (let i = 0; i < up.length; i += 500){ const { error } = await sb.from(MAP[n].t).upsert(up.slice(i, i + 500)); if (error) throw error; }
      up.forEach(r => snap[n].set(keyOf(n, r), JSON.stringify(r)));
    }
    const rg = reglagesRow(), rj = JSON.stringify(rg);
    if (rj !== snap.reglages){ const { error } = await sb.from('reglages').upsert(rg); if (error) throw error; snap.reglages = rj; }
    const hj = JSON.stringify(db.home);
    if (hj !== snap.home){ const { error } = await sb.from('page_accueil').upsert({ id: 1, contenu: db.home }); if (error) throw error; snap.home = hj; }
    saveWarned = false;
  } catch (e) {
    console.error(e);
    if (!saveWarned) toast('Enregistrement impossible : vérifie ta connexion.', 'bad');
    saveWarned = true;
  } finally {
    saving = false;
    if (saveAgain){ saveAgain = false; flush(); }
  }
}

// Mise à jour en direct : nouvelle réservation, nouveau message…
let channel = null, liveT = null;
function subscribeLive(){
  if (!sb) return;
  if (channel) sb.removeChannel(channel);
  channel = sb.channel('bs-' + (authUser?.id || 'public'));
  ['clients', 'clients_notes', 'abonnements', 'rdv', 'messages', 'avis', 'liste_attente', 'reglages', 'page_accueil']
    .forEach(t => channel.on('postgres_changes', { event: '*', schema: 'public', table: t }, onLive));
  channel.subscribe();
}
function onLive(){ clearTimeout(liveT); liveT = setTimeout(refresh, 700); }
async function refresh(){
  if (saving || saveT){ liveT = setTimeout(refresh, 1000); return; }
  try { if (!await load(true)){ liveT = setTimeout(refresh, 1000); return; } } catch (e) { return; }
  autoComplete();
  const active = document.activeElement;
  if (!active || !/INPUT|TEXTAREA|SELECT/.test(active.tagName)) render();
}
async function loadBusy(){
  if (isAdmin) return;
  const s = db.settings, from = today();
  const to = addDays(from, (Number(s.aheadWeeks) || 8) * 7 + 7 + (s.sub.on ? Math.ceil((Number(s.sub.months) || 0) * 31) : 0));
  const { data, error } = await sb.rpc('creneaux_occupes', { p_du: from, p_au: to });
  if (!error) busySlots = (data || []).map(r => ({ id: null, date: r.date, time: r.heure, duration: r.duree, mode: r.lieu }));
}

// Photos privées (coupes, justificatifs) : liens temporaires signés, valables 1 h.
let signed = {}, signedAt = 0;
const isUrl = p => /^(data:|https?:)/.test(String(p || ''));
function imgSrc(bucket, path){ if (!path) return ''; if (isUrl(path)) return path; return signed[bucket + '/' + path] || placeholder(0, 'PHOTO'); }
async function prefetchImages(){
  if (Date.now() - signedAt > 45 * 60000){ signed = {}; signedAt = Date.now(); }
  const need = { coupes: new Set(), justificatifs: new Set() };
  db.appts.forEach(a => { if (a.photo && !isUrl(a.photo)) need.coupes.add(a.photo); });
  db.clients.forEach(c => { const p = c.student?.proof; if (p && !isUrl(p)) need.justificatifs.add(p); });
  for (const [b, set] of Object.entries(need)){
    const paths = [...set].filter(p => !signed[b + '/' + p]);
    if (!paths.length) continue;
    const { data } = await sb.storage.from(b).createSignedUrls(paths, 3600);
    (data || []).forEach(x => { if (x.signedUrl) signed[b + '/' + x.path] = x.signedUrl; });
  }
}
// Supprime des fichiers privés (justificatif validé ou refusé, fiche ou rdv supprimés).
function dropFiles(bucket, paths){ paths = paths.filter(p => p && !isUrl(p)); if (paths.length && sb) sb.storage.from(bucket).remove(paths).then(() => {}, () => {}); }
async function dataUrlBlob(u){ return (await fetch(u)).blob(); }
async function uploadImage(bucket, path, dataUrl){
  const { error } = await sb.storage.from(bucket).upload(path, await dataUrlBlob(dataUrl), { contentType: 'image/jpeg' });
  if (error) throw error;
  return path;
}

// Cloudflare Turnstile : un jeton neuf (à usage unique) à chaque envoi sensible.
// Invisible la plupart du temps ; s'affiche seulement si Cloudflare a un doute.
let tsId = null;
function turnstileToken(){
  return new Promise((res, rej) => {
    let tries = 0;
    const go = () => {
      if (!window.turnstile){ if (++tries > 50) return rej(new Error('turnstile')); return setTimeout(go, 200); }
      if (tsId !== null){ try { turnstile.remove(tsId); } catch (e) {} tsId = null; }
      const box = $('#ts-box'); box.innerHTML = '';
      const t = setTimeout(() => rej(new Error('turnstile')), 120000);
      tsId = turnstile.render(box, { sitekey: CFG.turnstileSiteKey, appearance: 'interaction-only', language: 'fr',
        callback: tok => { clearTimeout(t); res(tok); setTimeout(() => { box.innerHTML = ''; }, 0); },
        'error-callback': () => { clearTimeout(t); rej(new Error('turnstile')); } });
    };
    go();
  });
}
async function captcha(){
  try { return await turnstileToken(); }
  catch (e) { throw new Error('Vérification anti-robot impossible. Recharge la page.'); }
}
// Réservation, contact et liste d'attente des visiteurs : via l'Edge Function, qui vérifie Turnstile.
async function callEdge(action, payload){
  const turnstile = await captcha();
  const { data, error } = await sb.functions.invoke('reservation', { body: { action, turnstile, ...payload } });
  if (error){ let m = ''; try { m = (await error.context.json()).error; } catch (e) {} throw new Error(m || 'Connexion impossible. Réessaie.'); }
  if (data && data.error) throw new Error(data.error);
  return data;
}
function authError(error){
  const c = error?.code || '';
  if (c === 'email_not_confirmed') return 'Confirme d\'abord ton e-mail (clique sur le lien reçu).';
  if (c === 'invalid_credentials') return 'E-mail ou mot de passe incorrect.';
  if (c === 'user_already_exists' || c === 'email_exists') return 'Un compte existe déjà avec cet e-mail. Connecte-toi ou utilise « Mot de passe oublié ».';
  if (c === 'weak_password') return 'Mot de passe trop faible : 8 caractères minimum, mélange lettres et chiffres.';
  if (c === 'over_request_rate_limit' || c === 'over_email_send_rate_limit') return 'Trop d\'essais. Attends quelques minutes.';
  if (c.startsWith('captcha')) return 'Vérification anti-robot échouée. Réessaie.';
  return 'Ça n\'a pas marché. Vérifie tes infos et réessaie.';
}
async function signIn(email, password){
  const captchaToken = await captcha();
  const { data, error } = await sb.auth.signInWithPassword({ email, password, options: { captchaToken } });
  if (error) throw new Error(authError(error));
  setAuth(data.session); await load(); subscribeLive();
}
async function signUp(email, password, first, last, phone){
  const captchaToken = await captcha();

function readImage(file, max = 1000, q = 0.72){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const sc = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', q));
      };
      img.onerror = rej; img.src = fr.result;
    };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}

function slotsFor(date, dur, mode, exclude = []){
  const c = dayConf(date); if (!c) return null;
  const s = db.settings, buf = Number(s.travel.buffer) || 0, limit = Date.now() + (Number(s.minNoticeH) || 0) * 3600000;
  const src = isAdmin ? db.appts.filter(a => a.date === date && a.status !== 'cancelled' && !exclude.includes(a.id)) : busySlots.filter(a => a.date === date);
  const busy = src.map(a => ({ st: mins(a.time), en: mins(a.time) + a.duration, b: a.mode === 'domicile' ? buf : 0 }));
  const myB = mode === 'domicile' ? buf : 0, step = Math.max(5, Number(s.step) || 30), out = [];
  for (let t = mins(c.start); t + dur <= mins(c.end); t += step){
    if (dt(date, hm(t)).getTime() < limit) continue;
    const taken = busy.some(x => { const g = Math.max(x.b, myB); return t < x.en + g && t + dur + g > x.st; });
    out.push({ time: hm(t), free: !taken });
  }
  return out;
}
function dayStatus(date, dur, mode){
  if (date < today()) return 'past';
  const sl = slotsFor(date, dur, mode);
  if (!sl) return 'closed';
  if (!sl.length) return date === today() ? 'past' : 'closed';
  return sl.some(x => x.free) ? 'open' : 'full';
}

  return { friends, earned, credits: r.on ? Math.max(0, earned - (c.refUsed || 0)) : 0 };

function computePrice({ service, client, mode, km, sub, n, allowRef }){
  const s = db.settings;
  const stu = studentOK(client) && service.student !== null && service.student !== '' && service.student !== undefined;
  const base = Number(stu ? service.student : service.price) || 0;
  const lines = [{ label: service.name + (stu ? ' · tarif étudiant' : ''), amount: base }];
  let disc = 0; const used = {};
  if (sub){ const d = Math.min(base, Number(s.sub.discount) || 0); lines.push({ label: 'Abonnement', amount: -d }); disc += d; }
  const rest = base - disc; let best = null;
  if (client && client.hasAccount && n && loyaltyHit(n))
    best = { k: 'loyalty', label: `Fidélité · ${n}e rdv −${s.loyalty.pct} %`, amount: round(rest * s.loyalty.pct / 100) };
  if (allowRef && client && refStats(client).credits > 0){
    const a = round(rest * s.referral.pct / 100);
    if (!best || a > best.amount) best = { k: 'referral', label: `Parrainage −${s.referral.pct} %`, amount: a };
  }
  if (best){ lines.push({ label: best.label, amount: -best.amount }); disc += best.amount; used[best.k] = true; }
  let travel = 0;
  if (mode === 'domicile'){ travel = travelFee(km || 0); lines.push({ label: `Déplacement · ≈ ${km || 0} km`, amount: travel }); }
  return { base, travel, discount: round(disc), total: round(Math.max(0, base - disc) + travel), lines, used };
}

function bookingPlan(b){
  const service = svc(b.svc), plan = [{ date: b.date, time: b.time, ok: true }];
  if (!b.freq) return plan;
  const end = addMonths(b.date, db.settings.sub.months);
  for (let d = addDays(b.date, 7 * b.freq); d < end; d = addDays(d, 7 * b.freq)){
    const sl = slotsFor(d, service.duration, b.mode);
    const free = (sl || []).filter(x => x.free);
    if (!free.length){ plan.push({ date: d, time: null, ok: false }); continue; }
    if (free.some(x => x.time === b.time)){ plan.push({ date: d, time: b.time, ok: true }); continue; }
    free.sort((x, y) => Math.abs(mins(x.time) - mins(b.time)) - Math.abs(mins(y.time) - mins(b.time)));
    plan.push({ date: d, time: free[0].time, ok: true, moved: true });
  }
  return plan;
}

const statusPill = a => { const m = { booked: ['À venir', 'gold'], done: ['Fait', 'ok'], cancelled: ['Annulé', 'bad'], noshow: ['Absent', 'warn'] }[a.status] || ['?', '']; return `<span class="pill ${m[1]}">${m[0]}</span>`; };

/* Agenda */
function bAgenda(){
  const f = ui.ag, now = new Date();
  let list = db.appts.filter(a => f === 'all' ? true : f === 'cancelled' ? a.status === 'cancelled' : f === 'past' ? a.status !== 'cancelled' && apptStart(a) <= now : a.status === 'booked' && apptStart(a) > now);
  list = sortAppts(list); if (f === 'past' || f === 'cancelled') list.reverse();
  const fresh = new Set(newAppts().map(a => a.id));
  let o = `<div class="row between"><h2 class="h2">Agenda</h2><button class="btn btn-gold btn-sm" data-a="apptNew">+ Rdv</button></div>
    <div class="chipset">${[['upcoming', 'À venir'], ['past', 'Passés'], ['cancelled', 'Annulés'], ['all', 'Tout']].map(([k, l]) => `<button class="chip" data-a="agF" data-f="${k}" aria-pressed="${f === k}">${l}</button>`).join('')}</div>`;
  if (!list.length) o += `<p class="muted">Aucun rdv ici.</p>`;
  let cur = '';
  o += `<div class="list">`;
  list.forEach(a => {
    if (a.date !== cur){ cur = a.date; o += `<div class="daytitle">${a.date === today() ? 'Aujourd\'hui · ' : ''}${dayLong(a.date)}</div>`; }
    const c = cById(a.clientId);
    o += `<button class="li" data-a="apptEdit" data-id="${a.id}"><span class="time">${hTime(a.time)}</span><div class="grow"><div class="li-t">${esc(cName(c))} ${fresh.has(a.id) ? '<span class="pill gold">Nouveau</span>' : ''}</div><div class="small muted">${esc(a.serviceName)} · ${modeLabel(a.mode)}${a.mode === 'domicile' && a.address ? ' · ' + esc(a.address.city) : ''}${a.subId ? ' · abo' : ''}</div></div><div class="ta-r stack-s"><b class="num">${eur(apptTotal(a))}</b>${statusPill(a)}</div></button>`;
  });
  o += `</div>`;
  if (fresh.size){ db.appts.forEach(a => { if (fresh.has(a.id)) a.seen = true; }); save(); setTimeout(() => { $('#top').innerHTML = viewTop(); }, 0); }
  return o;
}

/* Étudiants */

  let o = `<h2 class="h2">Demandes étudiant</h2>`;

/* Messages */
function convList(){
  const by = {};
  db.messages.forEach(m => { (by[m.clientId] = by[m.clientId] || []).push(m); });
  return Object.entries(by).map(([id, ms]) => { ms.sort((a, b) => a.at.localeCompare(b.at)); return { c: cById(id), id, last: ms[ms.length - 1], unread: ms.filter(m => m.from === 'client' && !m.readBarber).length, cancel: ms.some(m => m.kind === 'cancel' && !m.handled) }; })
    .filter(x => x.c).sort((a, b) => b.last.at.localeCompare(a.last.at));
}
function bMessages(){
  if (ui.conv && cById(ui.conv)) return bThread(cById(ui.conv));
  const list = convList();
  let o = `<h2 class="h2">Messages</h2>`;
  if (!list.length) return o + `<p class="muted">Aucune conversation. Pour écrire à un client, ouvre sa fiche dans Portefeuille.</p>`;
  return o + `<div class="list">${list.map(x => `<button class="li" data-a="convOpen" data-id="${x.id}"><div class="grow"><div class="row"><span class="li-t">${esc(cName(x.c))}</span>${x.cancel ? '<span class="pill bad">Annulation</span>' : ''}${x.c.hasAccount ? '' : '<span class="pill">Sans compte</span>'}</div><div class="small muted" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${x.last.from === 'barber' ? 'Toi : ' : ''}${esc(x.last.text)}</div></div><div class="ta-r stack-s"><span class="tiny muted">${ago(x.last.at)}</span>${x.unread ? `<span class="badge">${x.unread}</span>` : ''}</div></button>`).join('')}</div>`;
}
function bThread(c){
  const msgs = db.messages.filter(m => m.clientId === c.id).sort((a, b) => a.at.localeCompare(b.at));
  const up = sortAppts(db.appts.filter(a => a.clientId === c.id && isUpcoming(a)));
  return `<button class="back" data-a="convBack">‹ Conversations</button><div class="row between"><h2 class="h2">${esc(cName(c))}</h2>${c.hasAccount ? '' : '<span class="pill">Sans compte</span>'}</div>${telBtns(c)}
    ${!c.hasAccount ? `<p class="small muted">Ce client n'a pas de compte : il ne verra pas ta réponse dans l'app. Appelle-le ou envoie un SMS.</p>` : ''}
    ${up.length ? `<div class="card stack-s"><div class="label">Ses rdv à venir</div>${up.map(a => `<div class="row between"><span class="small">${dayShort(a.date)} · ${hTime(a.time)} · ${esc(a.serviceName)}</span><button class="btn btn-sm btn-danger" data-a="bCancelAppt" data-id="${a.id}">Annuler</button></div>`).join('')}</div>` : ''}
    <div class="thread">${msgs.map(m => msgBubble(m, m.from === 'barber')).join('')}</div>
    <div class="chipset">${db.templates.map((t, i) => `<button class="chip" data-a="tplUse" data-i="${i}" data-target="bm-text" data-c="${c.id}">${esc(t.slice(0, 22))}…</button>`).join('')}</div>

/* Clients */
function bClients(){

  }).join('')}</div>`;
}

/* Portefeuille */
function pfList(){
  const q = slug(ui.pfq), qp = normPhone(ui.pfq);
  const list = db.clients.filter(c => !q || slug(cName(c)).includes(q) || (qp.length > 1 && c.phone.includes(qp)) || (c.email || '').toLowerCase().includes(String(ui.pfq).trim().toLowerCase())).sort((a, b) => cName(a).localeCompare(cName(b)));
  if (!list.length) return `<p class="muted">Aucun client trouvé.</p>`;
  return list.map(c => { const st = clientStats(c); return `<button class="li" data-a="openWallet" data-id="${c.id}"><div class="grow"><div class="li-t">${esc(cName(c))}</div><div class="small muted">${c.hasAccount ? 'Avec compte' : 'Sans compte'} · ${st.count} rdv · ${eur(st.paid)} encaissé</div></div><span class="gold">›</span></button>`; }).join('');
}
function clientStats(c){
  const list = db.appts.filter(a => a.clientId === c.id), live = list.filter(a => a.status !== 'cancelled');
  const done = list.filter(a => a.status === 'done'), up = list.filter(isUpcoming);
  const paid = sum(done.map(apptTotal)), upc = sum(up.map(apptTotal));
  const fav = {}; live.forEach(a => fav[a.serviceName] = (fav[a.serviceName] || 0) + 1);
  const favName = Object.entries(fav).sort((a, b) => b[1] - a[1])[0];
  return { list, done, up, paid, upc, avg: done.length ? paid / done.length : 0, disc: sum(live.map(a => a.price?.discount || 0)), fav: favName ? favName[0] : '—', count: live.length };
}
function bWallet(){
  if (ui.pf && cById(ui.pf)) return walletCard(cById(ui.pf));
  return `<h2 class="h2">Portefeuille clients</h2><label class="field"><span>Rechercher (nom, téléphone, e-mail)</span><input id="pf-q" type="search" value="${esc(ui.pfq)}" placeholder="Ex. : Yanis ou 0612…"></label><div class="list" id="pf-list">${pfList()}</div>`;
}
function walletCard(c){

  const addrs = c.addresses.slice(); db.appts.forEach(a => { if (a.clientId === c.id && a.address && !addrs.some(x => x.street === a.address.street)) addrs.push(a.address); });

    <p class="small muted">Client depuis le ${dayShort(c.createdAt.slice(0, 10))}${c.email ? ' · ' + esc(c.email) : ''}${c.refCode ? ' · code ' + esc(c.refCode) : ''}</p></div>
    ${telBtns(c)}
    <div class="grid2"><div class="stat"><span class="label">Encaissé</span><b>${eur(st.paid)}</b></div><div class="stat"><span class="label">À venir</span><b>${eur(st.upc)}</b></div>
    <div class="stat"><span class="label">Panier moyen</span><b>${eur(st.avg)}</b></div><div class="stat"><span class="label">Réductions</span><b>${eur(st.disc)}</b></div>
    <div class="stat"><span class="label">Rdv</span><b>${st.count}</b></div><div class="stat"><span class="label">Préférée</span><b style="font-size:19px">${esc(st.fav)}</b></div></div>
    <div class="card stack-s"><div class="label">Fidélité et parrainage</div>${c.hasAccount ? `<p class="small">${k} visite${k > 1 ? 's' : ''} faite${k > 1 ? 's' : ''}${s.loyalty.on && nx ? ` · réduction au ${nx}e rdv` : ''}</p><p class="small">${r.friends} filleul${r.friends > 1 ? 's' : ''} · ${r.credits} réduction${r.credits > 1 ? 's' : ''} parrainage dispo</p>` : `<p class="small muted">Pas de compte : la fidélité ne compte pas.</p>`}</div>
    ${subs.length ? `<div class="card stack-s"><div class="label">Abonnement</div>${subs.map(x => { const l = db.appts.filter(a => a.subId === x.id && a.status !== 'cancelled'); return `<p class="small"><b>${esc(svc(x.serviceId)?.name || '')}</b> · toutes les ${x.freq} sem. · ${l.filter(a => a.status === 'done').length}/${l.length} faits · ${x.status === 'active' ? '<span class="pill ok">Actif</span>' : '<span class="pill">Arrêté</span>'}</p>`; }).join('')}</div>` : ''}
    ${addrs.length ? `<div class="card stack-s"><div class="label">Adresses</div>${addrs.map(a => `<div class="row between"><div class="grow small">${esc(addrStr(a))}${a.info ? `<br><span class="muted">${esc(a.info)}</span>` : ''}</div><a class="btn btn-sm" href="${mapsUrl(addrStr(a))}" target="_blank" rel="noopener">Itinéraire</a></div>`).join('')}</div>` : ''}
    <details class="card" ${st.list.length < 6 ? 'open' : ''}><summary class="h3">Historique (${st.list.length})</summary><div class="list">${sortAppts(st.list.slice()).reverse().map(a => `<button class="li" data-a="apptEdit" data-id="${a.id}"><div class="grow"><div class="li-t small">${dayShort(a.date)} · ${hTime(a.time)} · ${esc(a.serviceName)}</div><div class="tiny muted">${modeLabel(a.mode)}</div></div><div class="ta-r stack-s"><span class="num small">${eur(apptTotal(a))}</span>${statusPill(a)}</div></button>`).join('') || '<p class="muted small">Aucun rdv.</p>'}</div></details>
    ${revs.length ? `<div class="card stack-s"><div class="label">Avis</div>${revs.map(x => `<div>${stars(x.stars)} <span class="tiny muted">${x.public ? 'public' : 'privé'}</span><p class="small">${esc(x.text)}</p></div>`).join('')}</div>` : ''}

      <textarea id="pf-msg" placeholder="Ton message…"></textarea><button class="btn btn-gold" data-a="pfSend" data-id="${c.id}">Envoyer dans l'app</button>` : `<p class="small muted">Sans compte, il ne voit pas les messages de l'app. Utilise le bouton SMS.</p>`}</div>

    <button class="btn btn-danger" data-a="clientDel" data-id="${c.id}">Supprimer cette fiche et ses rdv</button>`;

/* Comptes */

/* Gains */
function bGains(){
  const p = ui.gain, m = today().slice(0, 7);
  const inP = a => p === 'all' || a.date.slice(0, 7) === m;
  const live = db.appts.filter(a => a.status !== 'cancelled' && a.status !== 'noshow' && inP(a));
  const done = live.filter(a => a.status === 'done'), up = live.filter(a => a.status === 'booked');
  const paid = sum(done.map(apptTotal)), planned = sum(up.map(apptTotal));
  const by = {}; live.forEach(a => { const k = a.serviceName; by[k] = by[k] || { n: 0, t: 0 }; by[k].n++; by[k].t += apptTotal(a); });
  const max = Math.max(1, ...Object.values(by).map(x => x.n));
  const nos = db.appts.filter(a => a.status === 'noshow' && inP(a)).length, canc = db.appts.filter(a => a.status === 'cancelled' && inP(a)).length;
  return `<h2 class="h2">Gains</h2><div class="chipset"><button class="chip" data-a="gainP" data-p="month" aria-pressed="${p === 'month'}">${MONTHS_L[new Date().getMonth()]}</button><button class="chip" data-a="gainP" data-p="all" aria-pressed="${p === 'all'}">Depuis le début</button></div>
    <div class="card gold stack-s"><span class="label">Total prévu</span><b class="total">${eur(paid + planned)}</b><span class="small muted">${live.length} rdv</span></div>
    <div class="grid2"><div class="stat"><span class="label">Encaissé</span><b>${eur(paid)}</b><span class="tiny muted">${done.length} rdv faits</span></div><div class="stat"><span class="label">À venir</span><b>${eur(planned)}</b><span class="tiny muted">${up.length} rdv</span></div>
    <div class="stat"><span class="label">Panier moyen</span><b>${eur(live.length ? (paid + planned) / live.length : 0)}</b></div><div class="stat"><span class="label">Déplacements</span><b>${eur(sum(live.map(a => a.price?.travel || 0)))}</b></div>
    <div class="stat"><span class="label">Réductions</span><b>${eur(sum(live.map(a => a.price?.discount || 0)))}</b></div><div class="stat"><span class="label">Annulés · absents</span><b>${canc} · ${nos}</b></div></div>
    <div class="card stack"><h3 class="h3">Rdv par prestation</h3>${Object.keys(by).length ? Object.entries(by).sort((a, b) => b[1].n - a[1].n).map(([k, v]) => `<div class="stack-s"><div class="row between small"><b>${esc(k)}</b><span class="num">${v.n} rdv · ${eur(v.t)}</span></div><div class="bar"><i style="width:${v.n / max * 100}%"></i></div></div>`).join('') : '<p class="muted small">Aucun rdv sur la période.</p>'}</div>`;
}

/* ===================== Fenêtre, toast ===================== */
function openModal(html){ const m = $('#modal'); m.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`; m.hidden = false; document.body.style.overflow = 'hidden'; }
function closeModal(){ const m = $('#modal'); m.hidden = true; m.innerHTML = ''; document.body.style.overflow = ''; }
let toastT;
function toast(msg, kind = ''){ const t = $('#toast'); t.textContent = msg; t.className = 'toast show ' + kind; clearTimeout(toastT); toastT = setTimeout(() => { t.className = 'toast'; }, 3200); }
function confirmBox(text, okLabel, fn, sub = ''){
  pendingConfirm = fn;
  openModal(`<div class="grab"></div><h3 class="h3">${esc(text)}</h3>${sub ? `<p class="muted small">${esc(sub)}</p>` : ''}<button class="btn btn-danger" data-a="confirmOk">${esc(okLabel)}</button><button class="btn btn-ghost" data-a="closeModal">Retour</button>`);
}
function copyText(t){
  const done = () => toast('Copié');
  try { navigator.clipboard.writeText(t).then(done, () => fallbackCopy(t)); } catch (e) { fallbackCopy(t); }
}
function fallbackCopy(t){
  openModal(`<div class="grab"></div><h3 class="h3">Copie le texte</h3><p class="small muted">Appuie longuement dans le cadre puis « Tout sélectionner » et « Copier ».</p><textarea id="copy-box" readonly style="min-height:160px">${esc(t)}</textarea><button class="btn" data-a="closeModal">Fermer</button>`);
  const b = $('#copy-box'); if (b){ b.focus(); b.select(); }
}
const fillTpl = (t, c) => t.replace(/\{prenom\}/g, c ? c.first : '');
function afterLogin(c){
  ui.auth = { mode: 'login' };
  if (ui.returnToBook && ui.b){ ui.returnToBook = false; Object.assign(ui.b, { first: c.first, last: c.last, phone: fmtPhone(c.phone) }); ui.tab = 'home'; ui.home = 'book'; }
  else ui.esp = 'compte';
  render(); top0(); toast('Salut ' + c.first + ' !');
}

/* ===================== Actions ===================== */
const A = {
  tab(el){ const t = el.dataset.t; if (t === 'home' && ui.tab === 'home') ui.home = 'vitrine'; if (t === 'me' && ui.tab === 'home' && ui.home === 'book' && ui.b?.step === 'done') ui.home = 'vitrine'; ui.tab = t; closeModal(); render(); top0(); },
  closeModal, confirmOk(){ const f = pendingConfirm; pendingConfirm = null; closeModal(); if (f) return f(); },
  copy(el){ copyText(el.dataset.t); },
  slideGo(el){ const car = $('#car'); if (car) car.scrollTo({ left: car.clientWidth * +el.dataset.i, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); },
  discover(){ const d = $('#decouvrir'); if (d){ const y = d.getBoundingClientRect().top + window.scrollY - 76; window.scrollTo({ top: y, behavior: 'smooth' }); } },

  apptSave(el){

    const date = $('#ae-date').value, time = $('#ae-time').value, sid = $('#ae-svc').value, mode = $('#ae-mode').value, status = $('#ae-status').value;

    const moved = date !== a.date || time !== a.time, oldD = a.date, oldT = a.time;
    if (sid !== a.serviceId || mode !== a.mode){
      const service = svc(sid);
      Object.assign(a, { serviceId: sid, serviceName: service.name, duration: service.duration, mode });
      if (mode === 'domicile' && a.km == null) a.km = 0;
      a.price = computePrice({ service, client: c, mode, km: a.km, sub: !!a.subId, n: c?.hasAccount ? visitsBefore(c.id, date, time, []) + 1 : 0, allowRef: false });
    }

    const clash = db.appts.some(x => x.id !== a.id && x.date === a.date && x.status !== 'cancelled' && mins(x.time) < mins(a.time) + a.duration && mins(x.time) + x.duration > mins(a.time));

  slideDel(el){ db.home.slides.splice(+el.dataset.i, 1); save(); render(); },
  slideMove(el){ const i = +el.dataset.i, j = i + +el.dataset.d, s = db.home.slides; if (j < 0 || j >= s.length) return; [s[i], s[j]] = [s[j], s[i]]; save(); render(); },
  salonValidate(){ const s = db.settings.salon; if (!s.street.trim() || !/^\d{5}$/.test(s.zip) || !s.city.trim()) return toast('Remplis la rue, un code postal à 5 chiffres et la ville.', 'bad'); s.validated = true; save(); render(); toast('Adresse validée, visible par les clients.'); },
  svcAdd(){ db.settings.services.push({ id: 'p' + uid(), name: 'Nouvelle prestation', price: 10, student: null, duration: 30, active: false }); save(); render(); toast('Ajoutée (inactive). Règle-la puis active-la.'); },
  svcDel(el){ const i = +el.dataset.i, x = db.settings.services[i]; confirmBox(`Supprimer « ${x.name} » ?`, 'Supprimer', () => { db.settings.services.splice(i, 1); save(); render(); }, 'Les rdv déjà pris gardent leur prestation.'); },
  payAdd(){ db.settings.payments.push({ name: 'Autre', on: true }); save(); render(); },
  payDel(el){ db.settings.payments.splice(+el.dataset.i, 1); save(); render(); },
  freqToggle(el){ const f = +el.dataset.f, a = db.settings.sub.freqs; const i = a.indexOf(f); if (i >= 0){ if (a.length === 1) return toast('Garde au moins un rythme.', 'bad'); a.splice(i, 1); } else { a.push(f); a.sort(); } save(); render(); },
  closedAdd(){ const v = $('#closed-add').value; if (!v) return toast('Choisis une date.', 'bad'); if (!db.settings.closed.includes(v)) db.settings.closed.push(v); save(); render(); },
  closedDel(el){ db.settings.closed = db.settings.closed.filter(d => d !== el.dataset.d); save(); render(); },
  exportData(){ copyText(JSON.stringify(db)); },
  importData(){
    let d; try { d = JSON.parse($('#imp-text').value); } catch (e) { return toast('Ce texte n\'est pas une sauvegarde valide.', 'bad'); }
    if (!d || !d.settings || !Array.isArray(d.appts)) return toast('Ce texte n\'est pas une sauvegarde valide.', 'bad');
    confirmBox('Remplacer toutes les données par cette sauvegarde ?', 'Restaurer', () => { db = fill(defaults(), adaptBackup(d)); save(); render(); toast('Sauvegarde restaurée.'); });
  },
  resetAll(){ confirmBox('Tout effacer ?', 'Tout effacer', () => { db = defaults(); save(); render(); toast('Tout est effacé.'); }, 'Clients, rdv, messages, réglages et page d\'accueil reviennent à zéro.'); },
  waitNotify(el){ const w = db.waitlist.find(x => x.id === el.dataset.id), c = cById(w.clientId); addMsg(c.id, 'barber', `Salut ${c.first}, une place s'est libérée le ${dayLong(w.date)}. Réserve vite depuis l'accueil !`); w.status = 'notified'; save(); render(); toast(c.first + ' est prévenu.'); },
  waitDel(el){ db.waitlist = db.waitlist.filter(x => x.id !== el.dataset.id); save(); render(); },
  rvHide(el){ const r = db.reviews.find(x => x.id === el.dataset.id); r.hidden = !r.hidden; save(); render(); },
  rvDel(el){ confirmBox('Supprimer cet avis ?', 'Supprimer', () => { db.reviews = db.reviews.filter(x => x.id !== el.dataset.id); save(); render(); }); },
  gainP(el){ ui.gain = el.dataset.p; render(); }
};
function pickFirstDay(thisWeekOnly){
  const b = ui.b, service = svc(b.svc);
  const last = thisWeekOnly ? b.week : db.settings.aheadWeeks - 1;
  for (let w = b.week; w <= last; w++){
    const st = weekStart(w);
    for (let i = 0; i < 7; i++){ const d = addDays(st, i); if (dayStatus(d, service.duration, b.mode) === 'open'){ b.week = w; b.date = d; return; } }
  }
  b.date = null;
}
async function addWait(c){
  const b = ui.b;
  let r; try { r = await rpc('rejoindre_attente', { p_date: b.date, p_prestation: b.svc }); await load(); } catch (e) { return toast(e.message, 'bad'); }
  toast(r === 'deja' ? 'Tu es déjà sur la liste d\'attente de ce jour.' : 'C\'est noté : je te préviens si une place se libère.');
}
// Sauvegarde de l'ancienne version (localStorage) : identifiants convertis en UUID,
// comptes transformés en fiches sans compte (le client recrée son compte par e-mail,
// puis tu rattaches sa fiche depuis le Portefeuille).
function adaptBackup(d){
  const isU = v => /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(String(v));
  const m = new Map(), id = v => v == null || v === '' ? null : isU(v) ? v : (m.has(v) ? m.get(v) : (m.set(v, uid()), m.get(v)));
  if (d.settings) delete d.settings.pin;
  d.clients = (d.clients || []).map(c => { const o = { ...c, id: id(c.id), userId: isU(c.userId) ? c.userId : null }; delete o.pw; delete o.login;
    if (!o.userId && !o.demo) o.hasAccount = false; return o; });
  const known = new Set(d.clients.map(c => c.id)), ok = x => known.has(x.clientId);
  d.subs = (d.subs || []).map(x => ({ ...x, id: id(x.id), clientId: id(x.clientId) })).filter(ok);
  const subs = new Set(d.subs.map(x => x.id));
  d.appts = (d.appts || []).map(a => ({ ...a, id: id(a.id), clientId: id(a.clientId), subId: subs.has(id(a.subId)) ? id(a.subId) : null })).filter(ok);
  const appts = new Set(d.appts.map(a => a.id));
  d.messages = (d.messages || []).map(x => ({ ...x, id: id(x.id), clientId: id(x.clientId), apptId: appts.has(id(x.apptId)) ? id(x.apptId) : null })).filter(ok);
  d.reviews = (d.reviews || []).map(x => ({ ...x, id: id(x.id), clientId: id(x.clientId) })).filter(x => !x.clientId || known.has(x.clientId));
  d.waitlist = (d.waitlist || []).map(x => ({ ...x, id: id(x.id), clientId: id(x.clientId) })).filter(ok);
  return d;
}

/* ===================== Événements ===================== */
function readVal(el){
  if (el.type === 'checkbox') return el.checked;
  if ('num' in el.dataset || el.type === 'number'){
    const v = String(el.value).trim().replace(',', '.');
    if (v === '') return 'null' in el.dataset ? null : 0;
    const n = parseFloat(v); return isNaN(n) ? 0 : n;
  }
  return el.value;
}
function onSet(path){
  if (path.startsWith('settings.salon.') && db.settings.salon.validated){
    db.settings.salon.validated = false;
    const s = $('#salon-status'); if (s) s.innerHTML = '<span class="pill warn">À valider, cachée</span>';
  }
  if (path.startsWith('settings.modes.') && !db.settings.modes.salon && !db.settings.modes.domicile){ setPath(db, path, true); toast('Garde au moins un lieu actif.', 'bad'); return true; }
}
let inFlight = false;
function runAction(fn, el, e){
  if (inFlight) return;
  const r = fn(el, e);
  if (r && typeof r.then === 'function'){ inFlight = true; document.body.style.cursor = 'progress'; r.catch(err => { console.error(err); toast('Connexion impossible. Réessaie.', 'bad'); }).finally(() => { inFlight = false; document.body.style.cursor = ''; }); }
}
document.addEventListener('click', e => {
  if (e.target.id === 'modal'){ closeModal(); return; }
  const el = e.target.closest('[data-a]'); if (!el || el.disabled) return;
  const fn = A[el.dataset.a]; if (!fn) return;
  e.preventDefault(); runAction(fn, el, e);
});
document.addEventListener('submit', e => { const f = e.target.closest('form[data-submit]'); if (!f) return; e.preventDefault(); const fn = A[f.dataset.submit]; fn && runAction(fn, f, e); });
let setT;
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.bind && el.type !== 'checkbox' && el.tagName !== 'SELECT') setPath(ui, el.dataset.bind, el.value);
  if (el.dataset.set && el.type !== 'checkbox' && el.tagName !== 'SELECT'){
    setPath(db, el.dataset.set, readVal(el)); onSet(el.dataset.set);
    clearTimeout(setT); setT = setTimeout(save, 250);
  }
  if (el.id === 'pf-q'){ ui.pfq = el.value; const l = $('#pf-list'); if (l) l.innerHTML = pfList(); }
});
document.addEventListener('change', async e => {
  const el = e.target;
  if (el.dataset.upload){
    const f = el.files && el.files[0]; if (!f) return;
    try {
      const url = await readImage(f, +el.dataset.max || 1000, 0.72);
      const i = el.dataset.upload.indexOf(':'), root = el.dataset.upload.slice(0, i), path = el.dataset.upload.slice(i + 1);
      if (root === 'db'){
        if (!isAdmin) return;
        let pub;
        try { const name = await uploadImage('vitrine', uid() + '.jpg', url); pub = sb.storage.from('vitrine').getPublicUrl(name).data.publicUrl; }
        catch (err){ return toast('Envoi de la photo impossible. Réessaie.', 'bad'); }
        setPath(db, path, pub); save();
      }
      else setPath(ui, path, url);
      render();
    } catch (err){ toast('Impossible de lire cette image. Essaie une capture d\'écran.', 'bad'); }
    return;
  }
  if (el.dataset.bind && (el.type === 'checkbox' || el.tagName === 'SELECT')){ setPath(ui, el.dataset.bind, readVal(el)); if ('rr' in el.dataset) render(); }
  if (el.dataset.set && (el.type === 'checkbox' || el.tagName === 'SELECT')){
    setPath(db, el.dataset.set, readVal(el)); const reverted = onSet(el.dataset.set); save();
    if (reverted) el.checked = true;
    if ('rr' in el.dataset) render();
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modal').hidden) closeModal(); });

/* ===================== Démarrage ===================== */
document.documentElement.lang = 'fr';
const h0 = (location.hash || '').slice(1);
if (h0 === 'coiffeur') ui.tab = 'barber'; else if (h0 === 'espace') ui.tab = 'me';
(async () => {
  if (!sb){ db = defaults(); render(); toast('Configuration manquante : crée config.js (voir le README).', 'bad'); return; }
  sb.auth.onAuthStateChange((event, session) => {
    const before = authUser?.id;
    setAuth(session);
    // Retour depuis le lien « mot de passe oublié » reçu par e-mail.
    if (event === 'PASSWORD_RECOVERY') setTimeout(() => { ui.tab = 'me'; ui.auth = { mode: 'reset' }; closeModal(); render(); top0(); }, 0);
    // Déconnexion depuis un autre onglet.
    if (event === 'SIGNED_OUT' && before) setTimeout(async () => { try { await load(); } catch (e) {} subscribeLive(); render(); }, 0);
  });
  const { data: { session } } = await sb.auth.getSession();
  setAuth(session);
  try { await load(); } catch (e) { console.error(e); db = db || defaults(); toast('Connexion au serveur impossible. Réessaie plus tard.', 'bad'); }
  autoComplete();
  render();
  subscribeLive();
})();
setInterval(() => { if (!db) return; const before = JSON.stringify(db.appts.map(a => a.status)); autoComplete(); if (before !== JSON.stringify(db.appts.map(a => a.status))) render(); }, 60000);
